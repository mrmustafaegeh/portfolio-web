<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/Burtons.otf"
      as="font"
      type="font/otf"
      crossorigin
    />

    <!-- Load CSS normally -->
    <link rel="stylesheet" href="/src/styles/globals.css" />

    <!-- SEO Meta Tags -->
    <title>Mustafa Egeh | Frontend Developer Portfolio</title>
    <meta name="description" content="Professional portfolio of Mustafa Egeh, a Frontend Developer specializing in React, Next.js, and modern web experiences. Explore projects, skills, and expertise." />
    <meta name="author" content="Mustafa Egeh" />
    <meta name="keywords" content="Frontend Developer, React Developer, Mustafa Egeh, Portfolio, Web Development, UI/UX" />
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #ffffff;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .dark .initial-loader {
          background: #0f172a;
          color: #f8fafc;
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #e2e8f0;
          border-top: 3px solid #0ea5e9;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .loading-text {
          font-weight: 600;
          letter-spacing: 0.1em;
          color: #64748b;
        }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <div class="loading-text">MUSTAFA EGEH</div>
      </div>
    </div>
    <noscript>
      <div style="text-align: center; padding: 50px;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to view this portfolio.</p>
      </div>
    </noscript>

    <!-- Defer the JavaScript -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
